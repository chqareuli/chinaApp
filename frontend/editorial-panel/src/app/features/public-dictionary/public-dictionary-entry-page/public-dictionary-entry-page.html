<div class="entry-page">
  <header>
    <a class="brand" routerLink="/"><span>汉</span><strong>Chinese.ge</strong></a>
    <a class="back" routerLink="/">← ლექსიკონში დაბრუნება</a>
  </header>

  <main>
    @if (loading()) {
      <div class="state">სტატია იტვირთება…</div>
    } @else if (notFound()) {
      <div class="state">
        <strong>სტატია ვერ მოიძებნა</strong>
        <span>სტატია არ არსებობს ან ჯერ არ არის გამოქვეყნებული.</span>
        <a routerLink="/">ძიებაზე დაბრუნება</a>
      </div>
    } @else if (entry(); as article) {
      <app-public-entry-article [entry]="article" />
    }
  </main>
</div>
