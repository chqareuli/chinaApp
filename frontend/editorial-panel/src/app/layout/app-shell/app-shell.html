<div class="handoff-ui panel-shell" [style.--panel-font-size]="appearance.fontSize() + 'px'">
  <nav class="cge-top" aria-label="Main navigation · 主导航">
    <div class="cge-actions">
      <a
        class="btn btn-ghost"
        routerLink="/adminpanel/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        aria-label="Home · 主页"
        title="Home · 主页"
        ><app-panel-icon name="home"
      /></a>
      <a
        class="btn btn-ghost"
        routerLink="/adminpanel/messages"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        aria-label="Messages · 站内消息"
        title="Messages · 站内消息"
        ><app-panel-icon name="messages" />
        @if (unreadMessages()) {
          <span class="cge-unread">{{ unreadMessages() }}</span>
        }
      </a>
      <a
        class="btn btn-ghost"
        routerLink="/adminpanel/notifications"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        aria-label="Notifications · 通知"
        title="Notifications · 通知"
        ><app-panel-icon name="notifications" />
        @if (unreadNotifications()) {
          <span class="cge-unread">{{ unreadNotifications() }}</span>
        }
      </a>
      @if (canCreateEntry()) {
        <a
          class="btn btn-ghost"
          routerLink="/adminpanel/entries/new"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          aria-label="New Entry · 新建词条"
          title="New Entry · 新建词条"
          ><app-panel-icon name="new"
        /></a>
      }
      <a
        class="btn btn-ghost"
        routerLink="/adminpanel/media"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        aria-label="Media · 图片库"
        title="Media · 图片库"
        ><app-panel-icon name="media"
      /></a>
      <a
        class="btn btn-ghost"
        routerLink="/adminpanel/accounting"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        aria-label="Statistics · 统计"
        title="Statistics · 统计"
        ><app-panel-icon name="statistics"
      /></a>
      @if (editor()) {
        <a
          class="btn btn-ghost"
          routerLink="/adminpanel/users"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          aria-label="Editorial team · 编辑团队"
          title="Editorial team · 编辑团队"
          ><app-panel-icon name="team"
        /></a>
      }
    </div>
    <form class="cge-search" (submit)="search($event, searchInput.value)">
      <label class="sr-only" for="global-search">Search · 查找</label
      ><input
        #searchInput
        id="global-search"
        class="form-control"
        type="search"
        placeholder="Search · 查找"
        (input)="searchChanged(searchInput.value)"
        (keydown.escape)="searchResults.set([])"
        autocomplete="off"
      />
      @if (searchResults().length) {
        <div class="search-results" aria-label="Search results · 搜索结果">
          @for (result of searchResults(); track result.id) {
            <a
              [routerLink]="['/adminpanel/entries', result.id]"
              (click)="searchResults.set([]); searchInput.value = ''"
              ><strong lang="zh">{{ result.lemma }}</strong
              ><span>{{ result.pinyin }}</span></a
            >
          }
        </div>
      }
    </form>
    <div class="cge-account">
      <a
        class="btn btn-ghost"
        routerLink="/adminpanel/profile"
        aria-label="My account · 我的账户"
        title="My account · 我的账户"
        ><app-editor-identity
          [id]="editor()?.id"
          [name]="editor()?.displayName"
          [role]="editor()?.role || ''" /></a
      ><button
        class="btn btn-ghost"
        type="button"
        (click)="logout()"
        [disabled]="loggingOut()"
        aria-label="Log out · 退出登录"
        title="Log out · 退出登录"
      >
        <app-panel-icon name="logout" />
      </button>
    </div>
  </nav>
  <main class="panel-content"><router-outlet /></main>
</div>
